<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <!-- Header with theme toggle -->
            <div class="calculator-header">
                <h1>Calculator</h1>
                <div class="header-controls">
                    <button id="history-toggle" class="icon-btn" title="Toggle History">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                    <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <path d="M12 1v6m0 6v6m4.22-13.22l4.24 4.24M18.36 18.36l4.24 4.24M20.66 12h6M-0.66 12h6m13.22 4.22l-4.24 4.24M5.64 5.64l-4.24 4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Display -->
            <div class="calculator-display">
                <div class="display-history" id="display-history"></div>
                <div class="display-current" id="display-current">0</div>
            </div>

            <!-- Scientific Mode Toggle -->
            <div class="mode-toggle">
                <button id="scientific-toggle" class="mode-btn">Scientific</button>
            </div>

            <!-- Scientific Buttons (Hidden by default) -->
            <div class="scientific-buttons" id="scientific-buttons">
                <button class="btn btn-scientific" data-action="sqrt">√</button>
                <button class="btn btn-scientific" data-action="power">x²</button>
                <button class="btn btn-scientific" data-action="power-y">xʸ</button>
                <button class="btn btn-scientific" data-action="log">log</button>
                <button class="btn btn-scientific" data-action="ln">ln</button>
                <button class="btn btn-scientific" data-action="sin">sin</button>
                <button class="btn btn-scientific" data-action="cos">cos</button>
                <button class="btn btn-scientific" data-action="tan">tan</button>
                <button class="btn btn-scientific" data-action="pi">π</button>
                <button class="btn btn-scientific" data-action="e">e</button>
                <button class="btn btn-scientific" data-action="factorial">n!</button>
                <button class="btn btn-scientific" data-action="reciprocal">1/x</button>
            </div>

            <!-- Main Calculator Buttons -->
            <div class="calculator-buttons">
                <!-- Row 1 -->
                <button class="btn btn-clear" data-action="clear">AC</button>
                <button class="btn btn-clear" data-action="delete">⌫</button>
                <button class="btn btn-operator" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>

                <!-- Row 2 -->
                <button class="btn btn-number" data-number="7">7</button>
                <button class="btn btn-number" data-number="8">8</button>
                <button class="btn btn-number" data-number="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>

                <!-- Row 3 -->
                <button class="btn btn-number" data-number="4">4</button>
                <button class="btn btn-number" data-number="5">5</button>
                <button class="btn btn-number" data-number="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>

                <!-- Row 4 -->
                <button class="btn btn-number" data-number="1">1</button>
                <button class="btn btn-number" data-number="2">2</button>
                <button class="btn btn-number" data-number="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>

                <!-- Row 5 -->
                <button class="btn btn-number btn-zero" data-number="0">0</button>
                <button class="btn btn-number" data-action="decimal">.</button>
                <button class="btn btn-equals" data-action="equals">=</button>
            </div>

            <!-- Sound Toggle -->
            <div class="sound-toggle">
                <button id="sound-toggle" class="icon-btn" title="Toggle Sound">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel" id="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <button id="clear-history" class="btn btn-clear">Clear</button>
            </div>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
